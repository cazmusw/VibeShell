[package]
name = "mosaic-shell-tools"
version = "0.4.10"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "shellctl"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
desktop = ["dep:gtk", "dep:gtk4-layer-shell", "dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr", "dep:async-channel", "dep:async-io", "dep:futures-lite", "dep:zbus", "dep:gio-unix", "dep:glib-unix", "dep:serde_json"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
toml = "=0.9.8"
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_20"], optional = true }
gtk4-layer-shell = { version = "=0.8.1", features = ["v1_3"], optional = true }
wayland-client = { version = "=0.31.15", optional = true }
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"], optional = true }
async-channel = { version = "=2.5.0", optional = true }
async-io = { version = "=2.6.0", optional = true }
futures-lite = { version = "=2.6.1", optional = true }
zbus = { version = "=5.19.0", optional = true }
gio-unix = { version = "=0.22.11", optional = true }
glib-unix = { version = "=0.22.8", optional = true }
serde_json = { version = "=1.0.149", optional = true }

[[bin]]
name = "mosaic-shell"
path = "src/bin/mosaic-shell.rs"
required-features = ["desktop"]

[[bin]]
name = "mosaic-services"
path = "src/bin/mosaic-services.rs"
required-features = ["desktop"]

[[bin]]
name = "mosaic-files"
path = "src/bin/mosaic-files.rs"
required-features = ["desktop"]

[[example]]
name = "desktop-drop-fixture"
required-features = ["desktop"]

[[example]]
name = "wifi-fixture"
required-features = ["desktop"]

[[example]]
name = "bluetooth-fixture"
required-features = ["desktop"]

[[example]]
name = "brightness-fixture"
required-features = ["desktop"]

[[example]]
name = "power-fixture"
required-features = ["desktop"]
