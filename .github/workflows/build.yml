name: Build and package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build NixOS package (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build and check the package
        run: nix build . --no-write-lock-file --print-build-logs --max-jobs 1 --cores 2
      - name: Export the package and its Nix runtime closure
        run: |
          nix shell --no-write-lock-file --impure --expr '
            (builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.zstd
          ' --command bash scripts/export-nix-package.sh result dist
      - name: Upload the NixOS package
        uses: actions/upload-artifact@v4
        with:
          name: VibeShell-x86_64-linux-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Create a draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VibeShell-x86_64-linux-${{ github.sha }}
          path: dist
      - name: Attach the binaries to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GH_REPO" --verify-tag --draft \
            --title "VibeShell $RELEASE_TAG" --generate-notes
